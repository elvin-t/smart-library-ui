<div class="login-page">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-icon">
        <i class="bi bi-book-half"></i>
      </div>

      <h3 class="mt-3 mb-1">Smart Library</h3>
      <p class="text-muted mb-0">Sign in to continue</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label">Email</label>

        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="admin@library.com"
          [class.is-invalid]="emailInvalid"
        />

        <div class="invalid-feedback" *ngIf="emailInvalid">
          Please enter a valid email.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>

        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
            [class.is-invalid]="passwordInvalid"
          />

          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="togglePassword()">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>

          <div class="invalid-feedback" *ngIf="passwordInvalid">
            Password is required.
          </div>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 mt-2"
        [disabled]="isLoading">

        <span *ngIf="!isLoading">Login</span>

        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Signing in...
        </span>
      </button>
    </form>

   <div class="text-center mt-4">
  <span class="text-muted">Don't have an account?</span>

  <a routerLink="/register" class="ms-1 fw-semibold">
    Register as Member
  </a>
</div>
  </div>
</div>
