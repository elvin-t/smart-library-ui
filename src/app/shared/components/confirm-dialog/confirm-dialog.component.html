<div class="modal-backdrop-custom" *ngIf="isVisible"></div>

<div class="confirm-modal-wrapper" *ngIf="isVisible">
  <div class="confirm-modal">

    <div class="confirm-icon" [ngClass]="iconWrapperClass">
      <i [class]="iconClass"></i>
    </div>

    <div class="confirm-content">
      <h5>{{ request?.title }}</h5>

      <p class="text-muted">
        {{ request?.message }}
      </p>
    </div>

    <div class="confirm-actions">
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="cancel()">
        {{ request?.cancelText }}
      </button>

      <button
        type="button"
        class="btn"
        [ngClass]="confirmButtonClass"
        (click)="confirm()">
        {{ request?.confirmText }}
      </button>
    </div>

  </div>
</div>
